<!-- ===== lives-cargando v1.2 · 2026-10-12 · aviso "Cargando datos…" cuando la pantalla abre VACÍA esperando datos.
     Va al inicio del <head>. Al terminar de leer la página (antes de que se vea) mira si hay contenido: si está vacía
     (menos de 120 letras visibles) muestra de inmediato el logo, el círculo y "Cargando datos…", sin dejar ver la
     pantalla a medio armar; se quita en cuanto aparece el contenido, cuando terminan las consultas a la base, si en
     1.5 s no hubo ninguna consulta, o a los 15 s. Si la pantalla ya tiene contenido (formularios, pantallas con su
     propio aviso de carga) no aparece nunca. ===== -->
<style id="lsCargaCss">
#lsCarga{position:fixed;inset:0;z-index:2147482000;background:#F1F6F4;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;font-family:Calibri,Arial,sans-serif;text-align:center;padding:24px;
  transition:opacity .25s ease}
#lsCarga.lsFuera{opacity:0;pointer-events:none}
#lsCarga img{height:34px;opacity:.82}
#lsCarga .lsGiro{width:38px;height:38px;border-radius:50%;border:3.5px solid #DCE5E2;border-top-color:#0F7A5A;
  animation:lsGiro .9s linear infinite}
#lsCarga b{font-size:16px;color:#0E3B36}
@keyframes lsGiro{to{transform:rotate(360deg)}}
html.lsDecide body{visibility:hidden}
html.lsDecide{background:#F1F6F4}
@media print{#lsCarga{display:none!important}}

    var reloj = setTimeout(function(){ if (ctl) ctl.abort(); }, ms || 15000);
    var cab = { 'Content-Type': 'application/json', apikey: SB_KEY };
    if (token) cab.Authorization = 'Bearer ' + token;
    return fetchBase(SB_URL + ruta, { method: 'POST', headers: cab, body: JSON.stringify(cuerpo || {}),
                                      cache: 'no-store', signal: ctl ? ctl.signal : undefined })
      .then(function(r){
        clearTimeout(reloj);
        return r.text().then(function(t){
          var j = null; try{ j = t ? JSON.parse(t) : null; }catch(e){}
          return { status: r.status, ok: r.ok, json: j };
        });

  function esperar(ms){ return new Promise(function(ok){ setTimeout(ok, ms); }); }

  /* ---------- llave vigente, renovada sin chocar con otras pestañas ---------- */
  var renovando = null;
  function llave(forzar){
    var s = sesion();
    if (!s || !s.sb || !s.sb.refresh) return Promise.resolve(null);
    if (!forzar && s.sb.exp - Date.now() > 60000) return Promise.resolve(s.sb.access);
    if (renovando) return renovando;
    var usada = s.sb.refresh;
    renovando = (function intento(n){
      var c = leerJ(localStorage, CANDADO);
      if (c && c.hasta > Date.now() && c.quien !== yo && n < 4){
        /* Otra pestaña o el portal está renovando: se espera y se usa lo que deje. */
        return esperar(1500).then(function(){
          var s2 = sesion();
          if (s2 && s2.sb && s2.sb.refresh !== usada && s2.sb.exp - Date.now() > 60000) return s2.sb.access;
          return intento(n + 1);
        });
      }
      try{ localStorage.setItem(CANDADO, JSON.stringify({ quien: yo, hasta: Date.now() + 10000 })); }catch(e){}
      return pedir('/auth/v1/token?grant_type=refresh_token', { refresh_token: usada })
        .then(function(r){
          if (r.ok && r.json && r.json.access_token){
            var s3 = sesion() || s;
            s3.sb = { access: r.json.access_token, refresh: r.json.refresh_token,
                      exp: Date.now() + (Number(r.json.expires_in) || 3600) * 1000 };
            guardar(s3);
            return s3.sb.access;
          }
          /* Rechazada: puede que otra pestaña la haya renovado un instante antes. */
          var s4 = sesion();
          if (s4 && s4.sb && s4.sb.refresh !== usada && s4.sb.exp - Date.now() > 60000) return s4.sb.access;
          /* v5: si la sesión del puente ya no se puede renovar, se descarta para que la
             próxima vez que se abra una herramienta el puente la vuelva a pedir. */
          if (r.status >= 400 && r.status < 500 && s.origen === 'sistemas'){
            borrar(); try{ sessionStorage.removeItem('lives_puente_recargado'); }catch(e){}
          }
          return null;
        }, function(){ return null; })                                             /* sin señal */
        .then(function(tk){
          try{ var c2 = leerJ(localStorage, CANDADO); if (c2 && c2.quien === yo) localStorage.removeItem(CANDADO); }catch(e){}
          return tk;
        });
    })(0).then(function(tk){ renovando = null; return tk; }, function(){ renovando = null; return null; });
    return renovando;
  }

  /* ---------- toda lectura a Supabase sale con la llave de la persona ---------- */
  function conLlave(init, tk){
    var o = {}, k;
    init = init || {};
    for (k in init) o[k] = init[k];
    var h = {};
    if (init.headers && typeof init.headers.forEach === 'function' && !(init.headers instanceof Array)){
      init.headers.forEach(function(v, n){ h[n] = v; });
    } else if (init.headers){
      for (k in init.headers) h[k] = init.headers[k];
    }
    var tiene = false;
    for (k in h) if (k.toLowerCase() === 'authorization') tiene = true;
    if (!tiene && tk) h.Authorization = 'Bearer ' + tk;
    var tieneKey = false;
    for (k in h) if (k.toLowerCase() === 'apikey') tieneKey = true;
    if (!tieneKey) h.apikey = SB_KEY;
    o.headers = h;
    return o;
  }

  /* ---------- MODO SUPERVISIÓN (desde v3) ---------- */
  /* Solo Rodrigo supervisa. Christian (ctalepcio) tiene acceso completo y guarda en
     todas las herramientas (lo da Supabase con es_superusuario()). */
  var SUPERVISORES = ['rcamogliano'];
  function supervisando(){
    var s = sesion(); if (!s) return false;
    return SUPERVISORES.indexOf(String(s.usuario || '').trim().toLowerCase()) !== -1;
  }
  /* El bloqueo de verdad lo hace Supabase: para los supervisores, todo pedido que intenta
     guardar corre en modo "solo lectura" y la base lo rechaza (y los archivos tampoco se
     suben). Aquí solo se deja la pantalla activa y se avisa con claridad. */
  var RPC_PUEDE = /(puede|permiso|es_editor|editor_de)/i;
  function rutaSB(url){ return url.indexOf(SB_URL) === 0 ? url.slice(SB_URL.length).split('?')[0] : ''; }
  function esRechazoSup(txt){ return /read-only transaction|solo lectura|SUPERVISION/i.test(txt || ''); }
  var _toastT = null;
  function avisoSup(txt){
    function poner(){
      var t = document.getElementById('lsToast');
      if (!t){ t = document.createElement('div'); t.id = 'lsToast'; document.body.appendChild(t); }
      t.textContent = txt; t.style.display = 'block';
      clearTimeout(_toastT); _toastT = setTimeout(function(){ t.style.display = 'none'; }, 4500);
    }
    if (document.body) poner(); else document.addEventListener('DOMContentLoaded', poner);
  }
  function marcaSup(){
    if (!supervisando() || document.getElementById('lsSup')) return;
    var b = document.createElement('div'); b.id = 'lsSup';
    b.textContent = '👁️ Modo supervisión · puedes usar todo, nada se guarda';
    document.body.appendChild(b);
  }
  if (document.body) marcaSup(); else document.addEventListener('DOMContentLoaded', marcaSup);
  function respuesta(cuerpo, estado){
    return new Response(JSON.stringify(cuerpo), { status: estado,
      headers: { 'Content-Type': 'application/json' } });
  }

  /* Para supervisores: "¿puede editar?" pasa a sí, y los rechazos por solo lectura se
     convierten en un aviso claro. Todo lo demás pasa igual que siempre. */
  function ajustarSup(r, url, metodo){
    if (!supervisando()) return r;
    var ruta = rutaSB(url);
    if (!ruta) return r;
    var esRpc = ruta.indexOf('/rest/v1/rpc/') === 0;
    var fn = esRpc ? ruta.slice('/rest/v1/rpc/'.length) : '';
    if (!r.ok){
      return r.clone().text().then(function(t){
        var sube = ruta.indexOf('/storage/v1/object') === 0 && !/\/object\/(list|sign|info)\//.test(ruta) &&
                   String(metodo).toUpperCase() !== 'GET';
        if (esRechazoSup(t) || sube){
          avisoSup('👁️ Modo supervisión: no se guardó. Estás revisando, los datos no cambian.');
          return respuesta({ message: 'Modo supervisión: no se guardó (estás revisando).',
                             error: 'MODO_SUPERVISION', code: 'SUPERVISION' }, r.status);
        }
        return r;
      }, function(){ return r; });
    }
    if (!esRpc) return r;
    return r.clone().text().then(function(t){
      var x = t.trim();
      if (RPC_PUEDE.test(fn) && (x === 'false' || x === '')) return respuesta(true, 200);
      if (x.charAt(0) === '{' && /"(puede|es_editor|editor)[a-z_]*"\s*:\s*false/i.test(x)){
        try{
          var o = JSON.parse(x), k, cambio = false;
          for (k in o) if (/^(puede|es_editor|editor)/i.test(k) && o[k] === false){ o[k] = true; cambio = true; }
          if (cambio) return respuesta(o, r.status);
        }catch(e){}
      }
      return r;
    }, function(){ return r; });
  }

  /* ---------- sin sesión: solo se anota en la consola, nunca se bloquea ---------- */
  var anotado = false;
  function sinSesion(){
    if (anotado) return;
    anotado = true;
    try{ console.info('[lives-sesion v5.2] Sin sesión del portal LIVES: se usa la clave pública.'); }catch(e){}
  }

  window.fetch = function(entrada, init){
    var url = (typeof entrada === 'string') ? entrada
            : (entrada && entrada.url) ? entrada.url : String(entrada || '');
    var metodo = (init && init.method) || (entrada && entrada.method) || 'GET';
    if (supervisando() && url.indexOf(SB_URL) === 0 && url.indexOf(SB_URL + '/rest/v1/') !== 0){
      return fetchBase(entrada, init).then(function(r){ return ajustarSup(r, url, metodo); });
    }
    if (typeof entrada !== 'string' || url.indexOf(SB_URL + '/rest/v1/') !== 0) return fetchBase(entrada, init);
    return esperaPuente().then(function(){ return llave(false); }).then(function(tk){
      if (!tk) sinSesion();
      return fetchBase(url, conLlave(init, tk)).then(function(r){
        if (r.status !== 401 || !tk) return ajustarSup(r, url, metodo);
        /* 401 con llave: venció o la cerraron. Se renueva una vez y se reintenta. */
        return llave(true).then(function(tk2){
          if (!tk2){ sinSesion(); return r; }
          return fetchBase(url, conLlave(init, tk2)).then(function(r2){
            return ajustarSup(r2, url, metodo);
          });
        });
      });
    });
  };

  /* ---------- el nombre sale de la sesión, no de la dirección ---------- */
  function fijarNombre(s){
    if (!s || !s.nombre) return;
    try{
      var u = new URL(location.href);
      if (u.searchParams.get('usuario') !== s.nombre){
        u.searchParams.set('usuario', s.nombre);
        u.searchParams.delete('nombre');
        history.replaceState(history.state, '', u.toString());
      }
    }catch(e){}
  }

  /* ---------- v5 · puente con el portal de Sistemas ---------- */
  var PUENTE_OK = 'lives_puente_recargado';
  function norm(x){
    return String(x || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[+._-]/g, ' ')
             .replace(/\s+/g, ' ').trim().toLowerCase();
  }
  function nombreLink(){
    try{ var u = new URL(location.href); return (u.searchParams.get('usuario') || u.searchParams.get('nombre') || '').trim(); }
    catch(e){ return ''; }
  }
  var pedido = nombreLink();
  var sx = sesion();
  /* Sesión del puente de otra persona (computadora compartida): se descarta. */
  if (sx && sx.origen === 'sistemas' && pedido && norm(pedido) !== norm(sx.nombre)){ borrar(); sx = null; }
  var puente = null;
  function enPortalNuevo(){
    if (window.top === window) return false;
    var anc = '';
    try{ var ao = location.ancestorOrigins; if (ao && ao.length) anc = ao[ao.length - 1]; }catch(e){}
    var ref = ''; try{ ref = document.referrer || ''; }catch(e){}
    return /^https:\/\/app\.lives\.com\.pe(\/|$)/.test(anc) || /^https:\/\/app\.lives\.com\.pe(\/|$)/.test(ref);
  }
  function esperaPuente(){ return puente || Promise.resolve(); }
  if (!sx && pedido && norm(pedido).length >= 5){
    var yaRecargo = null; try{ yaRecargo = sessionStorage.getItem(PUENTE_OK); }catch(e){}
    if (yaRecargo !== norm(pedido)){
      var raiz = document.documentElement, oculto = false;
      try{ raiz.style.visibility = 'hidden'; oculto = true; }catch(e){}
      var mostrar = function(){ if (oculto){ try{ raiz.style.visibility = ''; }catch(e){} oculto = false; } };
      var tope = setTimeout(mostrar, 6000);                 /* nunca deja la pantalla en blanco */
      puente = (function(){
        var ctl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
        var reloj = setTimeout(function(){ if (ctl) ctl.abort(); }, 8000);
        return fetchBase(SB_URL + '/functions/v1/sesion-sistemas', {
          method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SB_KEY },
          body: JSON.stringify({ nombre: pedido, equipo: equipo(), desde: location.pathname, portal_nuevo: enPortalNuevo() }),
          cache: 'no-store', signal: ctl ? ctl.signal : undefined
        }).then(function(r){ clearTimeout(reloj); return r.json(); })
          .then(function(j){
            if (!j || !j.ok || !j.sesion || !j.sesion.sb){ sinSesion(); mostrar(); clearTimeout(tope); return; }
            var d = j.sesion;
            d.sb = { access: d.sb.access, refresh: d.sb.refresh, exp: Date.now() + (Number(d.sb.expira_en) || 3600) * 1000 };
            d.vsesion = null;
            guardar(d);
            try{ sessionStorage.setItem(PUENTE_OK, norm(pedido)); }catch(e){}
            location.reload();                               /* se vuelve a abrir ya con su sesión */
          }, function(){ clearTimeout(reloj); sinSesion(); mostrar(); clearTimeout(tope); });
      })();
    }
  }

  /* ---------- al abrir ---------- */
  var s0 = sesion();
  if (!s0){
    sinSesion();
  } else {
    fijarNombre(s0);
    /* Si alguien ejecutó cerrar_todas_las_sesiones(), esta sesión ya no vale: se descarta
       y la herramienta sigue abierta sin sesión. Sin señal no se hace nada. */
    pedir('/rest/v1/rpc/version_sesion', {}, null, 8000).then(function(v){
      if (!v.ok || typeof v.json !== 'number') return;
      var s = sesion(); if (!s) return;
      if (s.vsesion === undefined || (s.vsesion !== null && s.vsesion !== v.json)){ borrar(); sinSesion(); return; }
      if (s.vsesion === null){ s.vsesion = v.json; guardar(s); }
    }).catch(function(){});
    /* v5.1: el nombre de la sesión se pone al día con el de la base (una recarga, una vez). */
    llave(false).then(function(tk){
      if (!tk) return;
      return pedir('/rest/v1/rpc/mi_nombre', {}, tk, 8000).then(function(v){
        if (!v.ok || typeof v.json !== 'string' || !v.json) return;

        }

      });
    }
  }

  window.LIVES_SESION = {
    version: 'lives-sesion v5.2 · 2026-10-06 (sin bloqueo · nombre al día · supervisión · puente Sistemas · portal nuevo)',
    supervision: function(){ return supervisando(); },
    actual: function(){ var s = sesion(); return s ? { usuario: s.usuario, nombre: s.nombre, conSupabase: !!s.sb } : null; },
    llave: function(){ return llave(false); },
    pedir: function(){ sinSesion(); }       /* se mantiene por compatibilidad: ya no bloquea */
  };
})();
</script>

<script id="lsBaJs">(function(){try{
